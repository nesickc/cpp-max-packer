name: Windows CPU build

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cpu-tests:
    runs-on: windows-2025-vs2026
    # Measured pre-qualifier work reaches 68 minutes; both qualifiers retain their
    # existing 30-minute outer bounds. This envelope does not change test/solver caps.
    timeout-minutes: 140
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.local/vcpkg-binary-cache
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Install locked development contract tools
        run: |
          New-Item -ItemType Directory -Force .local/ci | Out-Null
          npm install --prefix .local/package-manager --ignore-scripts --no-package-lock pnpm@11.19.0 *> .local/ci/package-manager.log
          if ($LASTEXITCODE -ne 0) { Get-Content .local/ci/package-manager.log; exit $LASTEXITCODE }
          & .local/package-manager/node_modules/.bin/pnpm.cmd install --frozen-lockfile --ignore-scripts *> .local/ci/node-install.log
          exit $LASTEXITCODE
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .local/vcpkg-binary-cache
          key: windows-cpu-v1-${{ hashFiles('vcpkg.json', 'cmake/dependencies.lock.json', 'cmake/toolchains.lock.json', 'CMakePresets.json') }}
          restore-keys: windows-cpu-v1-
      - name: Schema examples and generated TypeScript contracts
        run: |
          & .local/package-manager/node_modules/.bin/pnpm.cmd contracts:check *> .local/ci/contracts.log
          $contractResult = $LASTEXITCODE
          Get-Content .local/ci/contracts.log
          exit $contractResult
      - name: Python fixture, build-guard and performance-harness tests
        run: |
          New-Item -ItemType Directory -Force .local/ci | Out-Null
          python -m unittest discover -s tests -p 'test_*.py' *> .local/ci/python.log
          $testResult = $LASTEXITCODE
          Get-Content .local/ci/python.log -Tail 30
          exit $testResult
      - name: Desktop frontend tests and production assets
        run: |
          & .local/package-manager/node_modules/.bin/pnpm.cmd desktop:test *> .local/ci/desktop-tests.log
          if ($LASTEXITCODE -ne 0) { Get-Content .local/ci/desktop-tests.log; exit $LASTEXITCODE }
          & .local/package-manager/node_modules/.bin/pnpm.cmd desktop:build *> .local/ci/desktop-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content .local/ci/desktop-build.log; exit $LASTEXITCODE }
      - name: Prepare pinned vcpkg
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          # Versioned ports need historical blobs during dependency resolution.
          # Fetch them here instead of triggering lazy Git fetches inside vcpkg.
          git clone https://github.com/microsoft/vcpkg.git .local/vcpkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C .local/vcpkg checkout --detach $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .local/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inventory hosted Windows build tools
        run: |
          New-Item -ItemType Directory -Force .local/ci | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = @()
          if (Test-Path $vswhere) { $vs = @(& $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json | ForEach-Object { [pscustomobject]@{installationVersion=$_.installationVersion;installationPath=$_.installationPath} }) }
          $msvc = @()
          foreach ($installation in $vs) { $tools = Join-Path $installation.installationPath 'VC/Tools/MSVC'; Get-ChildItem $tools -Directory -ErrorAction SilentlyContinue | ForEach-Object { $p = Join-Path $_.FullName 'bin/Hostx64/x64/cl.exe'; if (Test-Path $p) { $msvc += [pscustomobject]@{toolsetName=$_.Name;path=$p;version=(Get-Item $p).VersionInfo.FileVersion} } } }
          $sdk = @(Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/Include' -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
          $cmake = (cmake --version | Select-Object -First 1); $ninja = (ninja --version | Select-Object -First 1)
          [pscustomobject]@{image=$env:ImageOS;image_version=$env:ImageVersion;visual_studio=$vs;msvc_toolsets=$msvc;windows_sdk_include=$sdk;cmake=$cmake;ninja=$ninja} | ConvertTo-Json -Depth 8 | Set-Content .local/ci/hosted-tools.json
      - name: Build and run native Debug and Release tests
        run: |
          $profiles = (Get-Content cmake/toolchains.lock.json -Raw | ConvertFrom-Json).profiles.PSObject.Properties
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or [string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'Hosted image identity is missing' }
          $matchedProfiles = @($profiles | Where-Object { $_.Value.runner_image -eq $env:ImageOS -and $_.Value.runner_image_version -eq $env:ImageVersion })
          if ($matchedProfiles.Count -ne 1) { throw "No unique locked profile for hosted image $env:ImageOS $env:ImageVersion" }
          $hostedProfile = $matchedProfiles[0].Name
          foreach ($configuration in @('debug', 'release')) {
            $log = ".local/ci/native-$configuration.log"
            & ./tools/Invoke-NativeTests.ps1 -Preset "windows-ninja-$configuration" -VcpkgRoot "$PWD/.local/vcpkg" -ToolchainProfile $hostedProfile -PythonPath python -Fresh 2>&1 | Tee-Object -FilePath $log
            $testResult = $LASTEXITCODE
            Get-Content $log -Tail 45
            if ($testResult -ne 0) { exit $testResult }
          }
          & ./tools/Invoke-NativeTests.ps1 -Preset windows-ninja-release -VcpkgRoot "$PWD/.local/vcpkg" -ToolchainProfile $hostedProfile -PythonPath python -BuildTarget spectrapack-engine -BuildOnly -WithoutTests *> .local/ci/native-production.log
          if ($LASTEXITCODE -ne 0) { Get-Content .local/ci/native-production.log; exit $LASTEXITCODE }
          $packageRoot = Join-Path $env:RUNNER_TEMP 'spectrapack-cpu-package'
          $runtimeReport = Join-Path $PWD '.local/ci/runtime.json'
          cmake --install out/build/windows-ninja-release --prefix $packageRoot --component cpu-diagnostics *> .local/ci/stage.log
          if ($LASTEXITCODE -ne 0) { Get-Content .local/ci/stage.log; exit $LASTEXITCODE }
          cmake --install out/build/windows-ninja-release --prefix $packageRoot --component engine *>> .local/ci/stage.log
          if ($LASTEXITCODE -ne 0) { Get-Content .local/ci/stage.log; exit $LASTEXITCODE }
          $runtimePython = (python -c "import sys; print(sys.executable)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $runtimePython -PathType Leaf)) { throw 'Could not resolve the active Python executable' }
          $engine = Join-Path $packageRoot 'bin/spectrapack-engine.exe'
          $importTest = Join-Path $PWD 'tests/protocol/import_subprocess_test.py'
          $solveTest = Join-Path $PWD 'tests/protocol/solve_subprocess_test.py'
          $resultContractValidator = Join-Path $PWD 'out/build/windows-ninja-release/bin/spectrapack_result_contract_check.exe'
          $solveControlsTest = Join-Path $PWD 'tests/protocol/solve_controls_subprocess_test.py'
          $cliMemoryHelper = Join-Path $PWD 'out/build/windows-ninja-release/bin/spectrapack_cli_memory_check.exe'
          $importLog = Join-Path $PWD '.local/ci/staged-import.log'
          $solveLog = Join-Path $PWD '.local/ci/staged-solve.log'
          $solveControlsLog = Join-Path $PWD '.local/ci/staged-solve-controls.log'
          $diagnostic = Join-Path $packageRoot 'diagnostics/spectrapack_cpu_dependency_smoke.exe'
          dumpbin /DEPENDENTS $diagnostic *> .local/ci/pe-imports.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $diagnosticLog = Join-Path $PWD '.local/ci/diagnostic.log'
          $savedPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Push-Location (Split-Path -Parent $diagnostic)
            try {
              & $diagnostic --runtime-report $runtimeReport *> $diagnosticLog
              $diagnosticResult = $LASTEXITCODE
              if ($diagnosticResult -ne 0) { exit $diagnosticResult }
              & $runtimePython $importTest $engine *> $importLog
              if ($LASTEXITCODE -ne 0) { Get-Content $importLog; exit $LASTEXITCODE }
              & $runtimePython $solveTest $engine --contract-validator $resultContractValidator *> $solveLog
              if ($LASTEXITCODE -ne 0) { Get-Content $solveLog; exit $LASTEXITCODE }
              & $runtimePython $solveControlsTest $engine --memory-helper $cliMemoryHelper *> $solveControlsLog
              if ($LASTEXITCODE -ne 0) { Get-Content $solveControlsLog; exit $LASTEXITCODE }
            } finally { Pop-Location }
          } finally { $env:PATH = $savedPath }
          Get-Content $diagnosticLog
          if ($diagnosticResult -ne 0) { exit $diagnosticResult }
          python tools/Inspect-CpuBuild.py audit-runtime --package-root $packageRoot --runtime-report $runtimeReport --pe-imports .local/ci/pe-imports.log
          exit $LASTEXITCODE
      - name: Desktop native adapter, shell and setup
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = '1.98.1'
          python -c "import pathlib,sys; sys.path.insert(0,'tests/protocol'); from solve_subprocess_test import write_cube_stl; write_cube_stl(pathlib.Path('.local/ci/desktop-cube.stl'),low=(17,-21,33))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tools/desktop/Invoke-Desktop.ps1 -Mode Test -TestStlPath .local/ci/desktop-cube.stl -PnpmPath .local/package-manager/node_modules/.bin/pnpm.cmd *> .local/ci/desktop-native.log
          if ($LASTEXITCODE -ne 0) { Get-Content .local/ci/desktop-native.log; exit $LASTEXITCODE }
          & pwsh -NoProfile -File ./tools/desktop/Test-ThirdPartyNotices.ps1 *> .local/ci/desktop-notices.log
          if ($LASTEXITCODE -ne 0) { Get-Content .local/ci/desktop-notices.log; exit $LASTEXITCODE }
          # Installer first leaves the runnable release build in bin/release.
          & ./tools/desktop/Invoke-Desktop.ps1 -Mode Installer -SkipFrontend -PnpmPath .local/package-manager/node_modules/.bin/pnpm.cmd *> .local/ci/desktop-shell.log
          if ($LASTEXITCODE -ne 0) { Get-Content .local/ci/desktop-shell.log; exit $LASTEXITCODE }
      - name: Retain desktop setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spectrapack-setup
          path: bin/installer/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Retain test and timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cpu-build-evidence
          path: |
            .local/ci/*.log
            .local/ci/*.json
            ${{ runner.temp }}/spectrapack-cpu-package/
            out/build/windows-ninja-*/build-metadata.json
            out/build/windows-ninja-*/installed-dependencies.json
            out/build/windows-ninja-*/vcpkg-manifest-install.log
            out/build/windows-ninja-*/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  # Spec 10.1: the readers of untrusted files run under libFuzzer and
  # AddressSanitizer, each with a time budget, a per-input timeout and a memory cap.
  windows-fuzz:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.local/vcpkg-binary-cache
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .local/vcpkg-binary-cache
          key: windows-cpu-v1-${{ hashFiles('vcpkg.json', 'cmake/dependencies.lock.json', 'cmake/toolchains.lock.json', 'CMakePresets.json') }}
          restore-keys: windows-cpu-v1-
      - name: Prepare pinned vcpkg
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git .local/vcpkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C .local/vcpkg checkout --detach $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .local/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and run the fuzz targets
        run: |
          New-Item -ItemType Directory -Force .local/ci | Out-Null
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $profiles = (Get-Content cmake/toolchains.lock.json -Raw | ConvertFrom-Json).profiles.PSObject.Properties
          $matchedProfiles = @($profiles | Where-Object { $_.Value.runner_image -eq $env:ImageOS -and $_.Value.runner_image_version -eq $env:ImageVersion })
          if ($matchedProfiles.Count -ne 1) { throw "No unique locked profile for hosted image $env:ImageOS $env:ImageVersion" }
          & ./tools/Invoke-NativeTests.ps1 -Preset windows-ninja-fuzz -VcpkgRoot "$PWD/.local/vcpkg" -ToolchainProfile $matchedProfiles[0].Name -PythonPath python -Fresh 2>&1 | Tee-Object -FilePath .local/ci/fuzz.log
          exit $LASTEXITCODE
      - name: Retain fuzz findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-fuzz-evidence
          path: |
            .local/ci/fuzz.log
            out/build/windows-ninja-fuzz/fuzz/*/crash-*
            out/build/windows-ninja-fuzz/fuzz/*/timeout-*
            out/build/windows-ninja-fuzz/fuzz/*/oom-*
            out/build/windows-ninja-fuzz/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
